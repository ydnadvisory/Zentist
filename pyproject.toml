[project]
name = "zentist-rpa"
version = "0.1.0"
description = "Reusable Python RPA foundation for Zentist portal automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.60.0",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
]

[project.scripts]
zentist-rpa = "zentist_rpa.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "audit" },
]
audit = ["pip-audit>=2.10.1"]
lint = ["ruff>=0.15.19", "ty>=0.0.53"]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = [
    "--cov=zentist_rpa",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
